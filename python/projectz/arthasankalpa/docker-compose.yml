version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: mf_advisor_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: mf_advisor_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mf_advisor
      POSTGRES_USER: mf_user
      POSTGRES_PASSWORD: mf_secret_local
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf_user -d mf_advisor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data: